name: Apply mobile miniapp
on:
  push:
    paths:
      - '.github/miniapp.patch'
      - '.github/workflows/apply-miniapp.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and verify miniapp
        run: |
          cp console.html miniapp.html
          patch miniapp.html < .github/miniapp.patch
          echo 'e4ad66d23db8ac7d9d0a660e02c8278a923158b05546871c8eb4011586d48e52  miniapp.html' | sha256sum -c -
          rm .github/miniapp.patch .github/workflows/apply-miniapp.yml
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add miniapp.html .github/miniapp.patch .github/workflows/apply-miniapp.yml
          git commit -m 'feat: add full mobile gateway miniapp'
          git push
